name: Check AtommUI package

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.22.0
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: npm test
      - name: Pack and install in a clean consumer
        shell: bash
        run: |
          pack_json="$(npm pack --json --pack-destination "$RUNNER_TEMP")"
          pack_name="$(node -e 'console.log(JSON.parse(process.argv[1])[0].filename)' "$pack_json")"
          node scripts/smoke-tarball.mjs "$RUNNER_TEMP/$pack_name"
